<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ypervaíno — Sessions</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#0c1116;--surface:#131a21;--surface-2:#1a2229;--surface-3:#232c34;
    --ink:#e7edf1;--ink-2:#93a3b1;--ink-3:#657585;--line:#232d36;--line-strong:#303c46;
    --signal:#3fe0d6;--signal-strong:#6beae1;--signal-soft:rgba(63,224,214,.12);
    --success:#58c793;--success-soft:rgba(88,199,147,.14);
    --warning:#e3a94a;--warning-soft:rgba(227,169,74,.14);
    --critical:#e2685f;--critical-soft:rgba(226,104,95,.14);
  }
  *{box-sizing:border-box;} html,body{margin:0;}
  body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,sans-serif;font-size:13.5px;}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}
  .main{max-width:1000px;margin:0 auto;padding:28px 32px 60px;}
  .eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);display:block;}
  .desc{color:var(--ink-2);font-size:13px;margin:6px 0 18px;}
  .filters{display:flex;gap:10px;margin-bottom:14px;}
  .select{background:var(--surface-2);border:1px solid var(--line-strong);color:var(--ink);border-radius:6px;padding:7px 10px;font-size:12.5px;font-family:inherit;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--ink-3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:10px 14px;border-bottom:1px solid var(--line);}
  td{padding:9px 14px;border-bottom:1px solid var(--line);}
  tr.row{cursor:pointer;}
  tr.row:hover{background:var(--surface-2);}
  .pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:600;}
  .pill.GREEN{background:var(--success-soft);color:var(--success);}
  .pill.YELLOW{background:var(--warning-soft);color:var(--warning);}
  .pill.RED{background:var(--critical-soft);color:var(--critical);}
  .pager{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:12px;color:var(--ink-2);}
  .pager button{background:var(--surface-2);border:1px solid var(--line-strong);color:var(--ink);border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit;}
  .pager button:disabled{opacity:.4;cursor:default;}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:10;}
  .overlay.open{display:block;}
  .drawer{position:fixed;top:0;right:-560px;width:560px;max-width:92vw;height:100vh;background:var(--surface);border-left:1px solid var(--line);transition:right .2s ease;z-index:11;display:flex;flex-direction:column;}
  .drawer.open{right:0;}
  .drawer-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .drawer-close{background:none;border:none;color:var(--ink-2);font-size:18px;cursor:pointer;}
  .drawer-body{flex:1;overflow-y:auto;padding:16px 20px;}
  .turn{display:flex;gap:10px;margin-bottom:12px;}
  .turn-avatar{width:24px;height:24px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;}
  .turn.assistant .turn-avatar{background:var(--signal-soft);color:var(--signal-strong);}
  .turn-speaker{font-weight:600;font-size:11.5px;color:var(--ink-3);}
  .turn-text{font-size:13px;margin-top:2px;}
  .turn-meta{font-size:10.5px;color:var(--ink-3);margin-top:3px;}
  .tool-card{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0 14px 34px;font-size:11.5px;}
  .tool-card.error{background:var(--critical-soft);border-color:var(--critical);}
  .section-label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:16px 0 8px;}
  .topnav{display:flex;gap:4px;padding:14px 32px;border-bottom:1px solid var(--line);background:var(--surface);}
  .topnav-link{color:var(--ink-2);text-decoration:none;font-size:12.5px;padding:6px 12px;border-radius:6px;}
  .topnav-link:hover{background:var(--surface-2);color:var(--ink);}
  .topnav-link.active{background:var(--signal-soft);color:var(--signal-strong);font-weight:600;}
</style>
</head>
<body>
<div class="topnav">
  <a href="/" class="topnav-link">New Study</a>
  <a href="/explore" class="topnav-link">Explore</a>
  <a href="/results" class="topnav-link">Results</a>
  <a href="/sessions" class="topnav-link active">Sessions</a>
</div>
<div class="main">
  <span class="eyebrow">Ypervaíno</span>
  <h1 style="font-size:22px;margin:2px 0 0;">Sessions</h1>
  <p class="desc" id="desc">Loading…</p>

  <div class="filters">
    <select class="select" id="f-cohort" onchange="load(0)">
      <option value="">All cohorts</option>
      <option value="before">before</option>
      <option value="after">after</option>
    </select>
    <select class="select" id="f-class" onchange="load(0)">
      <option value="">All health</option>
      <option value="GREEN">GREEN</option>
      <option value="YELLOW">YELLOW</option>
      <option value="RED">RED</option>
    </select>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>Session ID</th><th>Cohort</th><th>Scenario</th><th>Turns</th><th>Duration</th><th>Health</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="pager">
      <span id="pager-info"></span>
      <div>
        <button id="prev-btn" onclick="prevPage()">← Prev</button>
        <button id="next-btn" onclick="nextPage()">Next →</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <span class="mono" id="drawer-title">—</span>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

<script>
const PAGE_SIZE = 20;
let offset = 0, total = 0;

function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

async function load(newOffset){
  if (newOffset !== undefined) offset = newOffset;
  const cohort = document.getElementById('f-cohort').value;
  const classification = document.getElementById('f-class').value;
  const res = await fetch(`/api/v1/sessions?cohort=${cohort}&classification=${classification}&limit=${PAGE_SIZE}&offset=${offset}`);
  const data = await res.json();
  total = data.total;
  document.getElementById('desc').textContent = `${total} sessions`;
  document.getElementById('rows').innerHTML = data.sessions.map(s => `
    <tr class="row" onclick="openSession('${s.session_id}')">
      <td class="mono">${s.session_id}</td>
      <td>${s.cohort}</td>
      <td>${s.scenario}</td>
      <td>${s.turn_count}</td>
      <td>${s.duration_secs}s</td>
      <td><span class="pill ${s.classification}">${s.classification}</span></td>
    </tr>
  `).join('');
  document.getElementById('pager-info').textContent = `${offset + 1}–${Math.min(offset + PAGE_SIZE, total)} of ${total}`;
  document.getElementById('prev-btn').disabled = offset === 0;
  document.getElementById('next-btn').disabled = offset + PAGE_SIZE >= total;
}
function prevPage(){ load(Math.max(0, offset - PAGE_SIZE)); }
function nextPage(){ load(offset + PAGE_SIZE); }

async function openSession(id){
  const res = await fetch(`/api/v1/sessions/${id}`);
  const s = await res.json();
  document.getElementById('drawer-title').textContent = s.session_id;
  const turnsHtml = s.turns.map(t => `
    <div class="turn ${t.speaker}">
      <div class="turn-avatar">${t.speaker === 'assistant' ? 'B' : 'U'}</div>
      <div>
        <div class="turn-speaker">${t.speaker}</div>
        <div class="turn-text">${escapeHtml(t.text)}</div>
        <div class="turn-meta">latency ${t.e2e_latency}ms${t.interrupted ? ' · interrupted' : ''}</div>
      </div>
    </div>
  `).join('');
  const toolsHtml = s.tool_calls.length ? `
    <div class="section-label">Tool calls</div>
    ${s.tool_calls.map(tc => `<div class="tool-card ${tc.error ? 'error' : ''}"><b>${tc.tool_name}</b>${tc.error ? ` — error: ${tc.error}` : ' — ok'}</div>`).join('')}
  ` : '';
  document.getElementById('drawer-body').innerHTML = `
    <div class="section-label">${s.cohort} · ${s.scenario} · <span class="pill ${s.classification}">${s.classification}</span></div>
    ${turnsHtml}
    ${toolsHtml}
  `;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

load(0);
</script>
</body>
</html>
