<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ypervaíno — Sessions</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f9f8f8;--surface:#ffffff;--surface-2:#fcfcfb;--surface-3:#f3f2f0;
    --ink:#282624;--ink-2:#7c7972;--ink-3:#b5b1ad;--line:#e1deda;--line-strong:#b5b1ad;
    --signal:#f07400;--signal-strong:#ff7b00;--signal-soft:rgba(240,116,0,.12);
    --success:#027a48;--success-soft:#e7fdf3;--critical:#b72d0e;--critical-soft:#fce8e4;
  }
  *{box-sizing:border-box;} html,body{margin:0;}
  body{background:var(--paper);color:var(--ink);font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Roboto","Oxygen","Ubuntu","Cantarell","Fira Sans","Droid Sans","Helvetica Neue",sans-serif;font-size:15px;}
  .mono{font-family:"Roboto Mono",ui-monospace,monospace;}
  .main{max-width:1000px;margin:0 auto;padding:28px 32px 60px;}
  .eyebrow{font-family:"Manrope",-apple-system,BlinkMacSystemFont,sans-serif;font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;background:linear-gradient(90deg, var(--signal-strong), var(--signal));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;margin-bottom:6px;}
  .live-pill{display:flex;width:fit-content;align-items:center;gap:6px;background:var(--signal-soft);color:var(--signal-strong);border-radius:999px;padding:4px 10px 4px 8px;font-size:12.5px;font-weight:600;margin:6px 0 18px;}
  .live-dot{width:6px;height:6px;border-radius:50%;background:var(--signal);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px;}
  .card-pad{padding:16px 18px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
  .field{flex:1;min-width:160px;}
  .field-label{font-size:12.5px;color:var(--ink-2);display:block;margin-bottom:6px;}
  .input,.select{width:100%;background:var(--surface-2);border:1px solid var(--line-strong);color:var(--ink);border-radius:6px;padding:8px 10px;font-size:14px;font-family:inherit;}
  .btn{background:var(--signal);color:#ffffff;border:none;border-radius:7px;padding:10px 18px;font-size:14.5px;font-weight:600;font-family:inherit;cursor:pointer;}
  .segmented{display:inline-flex;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:9px;padding:3px;gap:2px;}
  .segmented-btn{padding:8px 16px;border-radius:6px;font-size:14px;color:var(--ink-2);background:none;font-family:inherit;border:none;cursor:pointer;}
  .segmented-btn.active{background:var(--signal);color:#ffffff;font-weight:600;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;color:var(--ink-3);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;padding:10px 14px;border-bottom:1px solid var(--line);}
  td{padding:9px 14px;border-bottom:1px solid var(--line);}
  tr.row-item{cursor:pointer;}
  tr.row-item:hover{background:var(--surface-2);}
  .topnav{display:flex;gap:4px;padding:14px 32px;background:#171717;}
  .topnav-link{color:rgba(255,255,255,.6);text-decoration:none;font-size:14px;padding:6px 12px;border-radius:6px;}
  .topnav-link:hover{background:rgba(255,255,255,.08);color:#ffffff;}
  .topnav-link.active{background:rgba(240,116,0,.16);color:var(--signal-strong);font-weight:600;}
  .error-box{background:var(--critical-soft);color:var(--critical);border-radius:8px;padding:12px 14px;font-size:14px;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:10;}
  .overlay.open{display:block;}
  .drawer{position:fixed;top:0;right:-560px;width:560px;max-width:92vw;height:100vh;background:var(--surface);border-left:1px solid var(--line);transition:right .2s ease;z-index:11;display:flex;flex-direction:column;}
  .drawer.open{right:0;}
  .drawer-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .drawer-close{background:none;border:none;color:var(--ink-2);font-size:20px;cursor:pointer;}
  .drawer-body{flex:1;overflow-y:auto;padding:16px 20px;}
  .turn{display:flex;gap:10px;margin-bottom:12px;}
  .turn-avatar{width:24px;height:24px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:11.5px;flex-shrink:0;}
  .turn.assistant .turn-avatar{background:var(--signal-soft);color:var(--signal-strong);}
  .turn-speaker{font-weight:600;font-size:13px;color:var(--ink-3);}
  .turn-text{font-size:14.5px;margin-top:2px;}
  .tool-card{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0 14px 34px;font-size:13px;word-break:break-all;}
</style>
</head>
<body>
<div class="topnav">
  <a href="/" class="topnav-link">New Study</a>
  <a href="/explore" class="topnav-link">Explore</a>
  <a href="/results" class="topnav-link">Results</a>
  <a href="/proposals" class="topnav-link">Proposals</a>
  <a href="/sessions" class="topnav-link active">Sessions</a>
</div>
<div class="main">
  <span class="eyebrow">Ypervaíno</span>
  <div class="live-pill"><span class="live-dot"></span>Live — real production data (bot_prod)</div>
  <h1 style="font-size:25px;margin:2px 0 0;">Sessions</h1>

  <div class="card card-pad">
    <div class="row">
      <div class="field">
        <label class="field-label">Tenant</label>
        <select class="select" id="tenant"><option value="">Loading…</option></select>
      </div>
      <div class="field">
        <label class="field-label">Assistant Origin ID</label>
        <input class="input" id="assistant_origin_id" placeholder="paste UUID">
      </div>
      <div class="field" style="flex:0 0 auto;">
        <label class="field-label">Channel</label>
        <div class="segmented" id="channel-toggle">
          <button class="segmented-btn active" data-channel="voice">Voice</button>
          <button class="segmented-btn" data-channel="chat">Chat</button>
        </div>
      </div>
    </div>
    <div class="row" style="margin-top:12px;">
      <div class="field"><label class="field-label">From</label><input class="input" type="datetime-local" id="date_start"></div>
      <div class="field"><label class="field-label">To</label><input class="input" type="datetime-local" id="date_end"></div>
      <div class="field" style="flex:0 0 auto;"><button class="btn" onclick="search()">Search</button></div>
    </div>
  </div>

  <div id="content"></div>
</div>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head"><span class="mono" id="drawer-title">—</span><button class="drawer-close" onclick="closeDrawer()">✕</button></div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

<script>
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

let channel = 'voice';
document.querySelectorAll('#channel-toggle .segmented-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#channel-toggle .segmented-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    channel = btn.dataset.channel;
  });
});

async function loadTenants(){
  const res = await fetch('/api/v1/ypervaino/tenants');
  const data = await res.json();
  document.getElementById('tenant').innerHTML = data.tenants.map(t => `<option value="${t}">${t}</option>`).join('');
}
loadTenants();

async function search(){
  const tenant = document.getElementById('tenant').value;
  const assistant_origin_id = document.getElementById('assistant_origin_id').value.trim();
  const start = document.getElementById('date_start').value;
  const end = document.getElementById('date_end').value;
  if (!tenant || !assistant_origin_id || !start || !end) {
    document.getElementById('content').innerHTML = '<div class="error-box">Fill in tenant, assistant origin id, and both dates.</div>';
    return;
  }
  document.getElementById('content').innerHTML = '<div class="card card-pad">Searching…</div>';
  const params = new URLSearchParams({
    study_type: 'single_cohort', tenant, assistant_origin_id, channel,
    date_range_start: start, date_range_end: end, limit: '100',
  });
  const res = await fetch('/api/v1/ypervaino/session_ids?' + params.toString());
  const data = await res.json();
  const ids = data.session_ids || [];
  if (!ids.length) {
    document.getElementById('content').innerHTML = '<div class="card card-pad">No sessions found for this scope.</div>';
    return;
  }
  document.getElementById('content').innerHTML = `
    <div class="card">
      <table>
        <thead><tr><th>Session ID</th></tr></thead>
        <tbody>${ids.map(id => `<tr class="row-item" onclick="openSession('${id}')"><td class="mono">${id}</td></tr>`).join('')}</tbody>
      </table>
    </div>
  `;
}

async function openSession(id){
  const res = await fetch('/api/v1/ypervaino/session_detail?session_id=' + encodeURIComponent(id));
  const s = await res.json();
  document.getElementById('drawer-title').textContent = s.voice_id || id;
  if (s.error) {
    document.getElementById('drawer-body').innerHTML = `<div class="error-box">${escapeHtml(s.error)}</div>`;
  } else {
    document.getElementById('drawer-body').innerHTML = s.turns.map(t => `
      <div class="turn ${t.query ? '' : 'assistant'}">
        <div class="turn-avatar">${t.query ? 'U' : 'B'}</div>
        <div>
          ${t.query ? `<div class="turn-speaker">user [${t.agent_name || ''}]</div><div class="turn-text">${escapeHtml(t.query)}</div>` : ''}
          <div class="turn-speaker">assistant [${t.agent_name || ''}]</div>
          <div class="turn-text">${escapeHtml(t.final_response || '')}</div>
        </div>
      </div>
      ${(t.tool_call_list || []).map(tc => `<div class="tool-card">${escapeHtml(JSON.stringify(tc))}</div>`).join('')}
    `).join('');
  }
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}
</script>
</body>
</html>
