<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ypervaíno — Live</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#0c1116;--surface:#131a21;--surface-2:#1a2229;--surface-3:#232c34;
    --ink:#e7edf1;--ink-2:#93a3b1;--ink-3:#657585;--line:#232d36;--line-strong:#303c46;
    --signal:#a855f7;--signal-strong:#c084fc;--signal-soft:rgba(168,85,247,.14);
    --success:#58c793;--success-soft:rgba(88,199,147,.14);
    --critical:#e2685f;--critical-soft:rgba(226,104,95,.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:radial-gradient(1000px 650px at 12% 115%, rgba(168,85,247,.32), transparent 60%),radial-gradient(800px 550px at 88% 105%, rgba(91,33,182,.28), transparent 60%),var(--paper);background-attachment:fixed;background-repeat:no-repeat;color:var(--ink);font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px;}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}
  .main{max-width:1100px;margin:0 auto;padding:28px 32px 60px;}
  .eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;background:linear-gradient(90deg, var(--signal-strong), var(--signal));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;margin-bottom:6px;}
  .live-pill{display:inline-flex;align-items:center;gap:6px;background:var(--success-soft);color:var(--success);border-radius:999px;padding:4px 10px 4px 8px;font-size:12.5px;font-weight:600;margin-bottom:14px;}
  .live-dot{width:6px;height:6px;border-radius:50%;background:var(--success);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .desc{color:var(--ink-2);font-size:14.5px;margin:6px 0 22px;max-width:700px;line-height:1.5;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:18px;}
  .card-head{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line);}
  .card-title{font-size:15px;font-weight:600;margin:0;}
  .card-pad{padding:16px 18px;}
  .grid-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 17px;}
  .kpi-label{font-size:12.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .kpi-value{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;}
  .grid-aspects{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .aspect-card{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:14px 15px;}
  .aspect-card-title{font-size:14px;font-weight:600;margin-bottom:12px;}
  .compare-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;}
  .compare-label{font-size:11.5px;text-transform:uppercase;color:var(--ink-3);letter-spacing:.03em;}
  .compare-val{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;}
  .compare-divider{height:1px;background:var(--line);margin:8px 0;}
  .delta-badge{font-size:13.5px;font-weight:700;margin-top:6px;}
  .delta-badge.good{color:var(--success);}
  .delta-badge.bad{color:var(--critical);}
  .footnote{font-size:13px;color:var(--ink-3);margin-top:24px;line-height:1.6;}
  .footnote code{color:var(--ink-2);}
  .topnav{display:flex;gap:4px;padding:14px 32px;border-bottom:1px solid var(--line);background:var(--surface);}
  .topnav-link{color:var(--ink-2);text-decoration:none;font-size:14px;padding:6px 12px;border-radius:6px;}
  .topnav-link:hover{background:var(--surface-2);color:var(--ink);}
  .topnav-link.active{background:var(--signal-soft);color:var(--signal-strong);font-weight:600;}
  .error-box{background:var(--critical);color:#2a0b08;border-radius:8px;padding:14px 16px;font-size:14.5px;}
</style>
</head>
<body>
<div class="topnav">
  <a href="/" class="topnav-link">New Study</a>
  <a href="/explore" class="topnav-link">Explore</a>
  <a href="/results" class="topnav-link active">Results</a>
  <a href="/sessions" class="topnav-link">Sessions</a>
</div>
<div class="main">
  <span class="eyebrow">Ypervaíno</span>
  <div class="live-pill"><span class="live-dot"></span>Live — real production data (bot_prod)</div>
  <h1 style="font-size:25px;margin:0 0 4px;">Results</h1>
  <p class="desc" id="desc">Loading…</p>

  <div id="content"></div>

  <p class="footnote">
    Numbers come from BotProbe <code>/trace</code> events (Elasticsearch) for sessions scoped via
    Mongo <code>AssistantSession</code>. See <code>sample_gothrough.md</code> for the full pipeline.
  </p>
</div>

<script>
function fmtPct(n){ return (n > 0 ? "+" : "") + n + "%"; }
function fmtVal(v){
  if (typeof v !== "number") return v;
  if (Math.abs(v) >= 1000) return Math.round(v).toLocaleString();
  if (Math.abs(v) < 1 && v !== 0) return v.toFixed(3);
  return Number(v.toFixed(2));
}
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

async function load(){
  const slug = new URLSearchParams(window.location.search).get('study');
  if (!slug) {
    document.getElementById('content').innerHTML = '<div class="error-box">Missing ?study= slug.</div>';
    return;
  }
  document.getElementById('content').innerHTML = '<div class="card"><div class="card-pad">Loading evaluation results…</div></div>';
  let data;
  for (let i = 0; i < 120; i++) {
    const res = await fetch(`/api/v1/ypervaino/studies/${encodeURIComponent(slug)}/results`);
    data = await res.json();
    if (data.status === 'complete' && data.aspects) break;
    if (data.error && data.status !== 'running') break;
    await new Promise(r => setTimeout(r, 2000));
  }

  if (data.error && !data.aspects?.length) {
    document.getElementById('content').innerHTML = `<div class="error-box"><b>Error:</b> ${escapeHtml(String(data.error))}</div>`;
    return;
  }

  const isComparative = data.study_type === 'comparative' || ((data.cohort_sizes?.before || 0) > 0 && (data.cohort_sizes?.after || 0) > 0);

  document.getElementById("desc").textContent = isComparative
    ? `${data.cohort_sizes.total} sessions analyzed — ${data.cohort_sizes.before} before / ${data.cohort_sizes.after} after`
    : `${data.cohort_sizes.total} sessions analyzed (single cohort)`;

  const aspectsHtml = (data.aspects || []).map(a => {
    if (a.no_data) {
      // The plan referenced something the resolver couldn't compute (e.g. an
      // unrecognized component ref/kind) -- say so plainly rather than
      // showing a fabricated 0 that would look like a real measurement.
      return `
      <div class="aspect-card">
        <div class="aspect-card-title">${escapeHtml(a.name)}</div>
        <div class="compare-row"><span class="compare-label">Value</span><span class="compare-val" style="color:var(--ink-3);">No data</span></div>
      </div>`;
    }
    if (!isComparative) {
      const val = a.after ?? a.before ?? a.value ?? 0;
      return `
      <div class="aspect-card">
        <div class="aspect-card-title">${escapeHtml(a.name)}</div>
        <div class="compare-row"><span class="compare-label">Value</span><span class="compare-val">${fmtVal(val)}</span></div>
      </div>`;
    }
    const isGood = a.good_if === "down" ? a.delta_pct <= 0 : a.delta_pct >= 0;
    return `
      <div class="aspect-card">
        <div class="aspect-card-title">${escapeHtml(a.name)}</div>
        <div class="compare-row"><span class="compare-label">Before</span><span class="compare-val">${fmtVal(a.before)}</span></div>
        <div class="compare-row"><span class="compare-label">After</span><span class="compare-val">${fmtVal(a.after)}</span></div>
        <div class="compare-divider"></div>
        <div class="delta-badge ${isGood ? "good" : "bad"}">${fmtPct(a.delta_pct)}</div>
      </div>
    `;
  }).join("");

  const hypHtml = (data.hypotheses || []).map(h => {
    const rates = h.rates || {};
    const before = rates.before || rates.all || {};
    const after = rates.after || {};
    const sig = (h.proof || {}).significant;
    const rateStr = rates.after
      ? `Before ${Math.round((before.rate||0)*100)}% (${before.support||0}) · After ${Math.round((after.rate||0)*100)}% (${after.support||0})${sig !== undefined ? (sig ? ' · significant' : ' · not significant') : ''}`
      : `${Math.round((before.rate||0)*100)}% match (${before.support||0} sessions)`;
    const counters = (h.counter_examples || []).slice(0,3).map(id => `<div class="mono" style="font-size:12.5px;color:var(--ink-3);">${escapeHtml(id)}</div>`).join('');
    return `<div class="aspect-card"><div class="aspect-card-title">${escapeHtml(h.title||h.id||'')}</div><div style="font-size:13.5px;color:var(--ink-2);margin:6px 0;">${escapeHtml(h.description||'')}</div><div class="delta-badge">${rateStr}${h.rejected?' · low support':''}</div>${counters}</div>`;
  }).join('');

  const narrative = data.narrative ? `<div class="card"><div class="card-head"><h3 class="card-title">Summary</h3></div><div class="card-pad" style="color:var(--ink-2);line-height:1.6;">${escapeHtml(data.narrative)}</div></div>` : '';

  document.getElementById('content').innerHTML = `
    <div class="grid-kpi">
      <div class="kpi"><div class="kpi-label">Sessions analyzed</div><div class="kpi-value">${data.cohort_sizes.total}</div></div>
      ${isComparative ? `
      <div class="kpi"><div class="kpi-label">Before cohort</div><div class="kpi-value">${data.cohort_sizes.before}</div></div>
      <div class="kpi"><div class="kpi-label">After cohort</div><div class="kpi-value">${data.cohort_sizes.after}</div></div>
      ` : `
      <div class="kpi"><div class="kpi-label">Aspects</div><div class="kpi-value">${(data.aspects||[]).length}</div></div>
      <div class="kpi"><div class="kpi-label">Hypotheses</div><div class="kpi-value">${(data.hypotheses||[]).length}</div></div>
      `}
    </div>
    ${narrative}
    <div class="card">
      <div class="card-head"><h3 class="card-title">Aspects</h3></div>
      <div class="card-pad"><div class="grid-aspects">${aspectsHtml || '<p>No aspects computed.</p>'}</div></div>
    </div>
    <div class="card">
      <div class="card-head"><h3 class="card-title">Hypotheses</h3></div>
      <div class="card-pad"><div class="grid-aspects">${hypHtml || '<p>No hypotheses evaluated.</p>'}</div></div>
    </div>
  `;
}

load();
</script>
</body>
</html>
