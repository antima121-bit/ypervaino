<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ypervaíno — Live</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f9f8f8;--surface:#ffffff;--surface-2:#fcfcfb;--surface-3:#f3f2f0;
    --ink:#282624;--ink-2:#7c7972;--ink-3:#b5b1ad;--line:#e1deda;--line-strong:#b5b1ad;
    --signal:#f07400;--signal-strong:#ff7b00;--signal-soft:rgba(240,116,0,.12);
    --success:#027a48;--success-soft:#e7fdf3;
    --critical:#b72d0e;--critical-soft:#fce8e4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--paper);color:var(--ink);font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Roboto","Oxygen","Ubuntu","Cantarell","Fira Sans","Droid Sans","Helvetica Neue",sans-serif;font-size:15px;}
  .mono{font-family:"Roboto Mono",ui-monospace,monospace;}
  .main{max-width:1100px;margin:0 auto;padding:28px 32px 60px;}
  .eyebrow{font-family:"Manrope",-apple-system,BlinkMacSystemFont,sans-serif;font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;background:linear-gradient(90deg, var(--signal-strong), var(--signal));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;margin-bottom:6px;}
  .live-pill{display:flex;width:fit-content;align-items:center;gap:6px;background:var(--signal-soft);color:var(--signal-strong);border-radius:999px;padding:4px 10px 4px 8px;font-size:12.5px;font-weight:600;margin-bottom:14px;}
  .live-dot{width:6px;height:6px;border-radius:50%;background:var(--signal);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .desc{color:var(--ink-2);font-size:14.5px;margin:6px 0 22px;max-width:700px;line-height:1.5;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:18px;}
  .card-head{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line);}
  .card-title{font-size:15px;font-weight:600;margin:0;}
  .card-pad{padding:16px 18px;}
  .grid-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 17px;}
  .kpi-label{font-size:12.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .kpi-value{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;}
  .grid-aspects{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .grid-hyp{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;}
  .aspect-card{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:14px 15px;}
  .aspect-card-title{font-size:14px;font-weight:600;margin-bottom:12px;}
  .compare-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;}
  .compare-label{font-size:11.5px;text-transform:uppercase;color:var(--ink-3);letter-spacing:.03em;}
  .compare-val{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;}
  .compare-divider{height:1px;background:var(--line);margin:8px 0;}
  .delta-badge{font-size:13.5px;font-weight:700;margin-top:6px;}
  .delta-badge.good{color:var(--success);}
  .delta-badge.bad{color:var(--critical);}
  .hyp-desc{font-size:13.5px;color:var(--ink-2);margin:6px 0 12px;line-height:1.5;}
  .hyp-rates{display:flex;gap:20px;margin-bottom:10px;}
  .hyp-rate-label{font-size:10px;text-transform:uppercase;color:var(--ink-3);letter-spacing:.03em;display:block;margin-bottom:2px;}
  .hyp-rate-val{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;}
  .hyp-rate-val .n{font-size:11px;font-weight:400;color:var(--ink-3);}
  .status-pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;margin:0 6px 6px 0;}
  .status-pill.good{background:var(--success-soft);color:var(--success);}
  .status-pill.bad{background:var(--critical-soft);color:var(--critical);}
  .hyp-counters{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
  .hyp-counters-label{font-size:10.5px;text-transform:uppercase;color:var(--ink-3);letter-spacing:.03em;margin-bottom:5px;}
  .hyp-counters .mono{font-size:12px;color:var(--ink-2);line-height:1.6;}
  .chart-card{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:12px;}
  .chart-card-title{font-size:13px;font-weight:600;margin-bottom:8px;}
  .chart-card img{width:100%;height:auto;border-radius:6px;display:block;background:#fff;}
  .footnote{font-size:13px;color:var(--ink-3);margin-top:24px;line-height:1.6;}
  .footnote code{color:var(--ink-2);}
  .topnav{display:flex;gap:4px;padding:14px 32px;background:#171717;}
  .topnav-link{color:rgba(255,255,255,.6);text-decoration:none;font-size:14px;padding:6px 12px;border-radius:6px;}
  .topnav-link:hover{background:rgba(255,255,255,.08);color:#ffffff;}
  .topnav-link.active{background:rgba(240,116,0,.16);color:var(--signal-strong);font-weight:600;}
  .error-box{background:var(--critical-soft);color:var(--critical);border-radius:8px;padding:14px 16px;font-size:14.5px;}
  .hidden{display:none!important;}
  .btn{background:var(--signal);color:#ffffff;border:none;border-radius:8px;padding:11px 20px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;}
  .btn:hover{filter:brightness(1.05);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2);}
  .proposals-bar{display:flex;align-items:center;gap:12px;margin-top:24px;flex-wrap:wrap;}
  .proposals-status{font-size:14px;color:var(--ink-2);}
  .run-log{display:none;margin-top:12px;background:#0d1117;color:#c9d1d9;border-radius:8px;padding:10px 12px;font-family:"Roboto Mono",ui-monospace,monospace;font-size:12px;line-height:1.45;max-height:220px;overflow-y:auto;white-space:pre-wrap;}
  .run-log.visible{display:block;}
</style>
</head>
<body>
<div class="topnav">
  <a href="/" class="topnav-link">New Study</a>
  <a href="/explore" class="topnav-link">Explore</a>
  <a href="/results" class="topnav-link active">Results</a>
  <a href="/proposals" class="topnav-link">Proposals</a>
  <a href="/sessions" class="topnav-link">Sessions</a>
</div>
<div class="main">
  <span class="eyebrow">Ypervaíno</span>
  <div class="live-pill"><span class="live-dot"></span>Live — real production data (bot_prod)</div>
  <h1 style="font-size:25px;margin:0 0 4px;">Results</h1>
  <p class="desc" id="desc">Loading…</p>

  <div id="content"></div>

  <div id="proposals-bar" class="proposals-bar hidden">
    <button class="btn" id="proposals-btn">Generate proposals</button>
    <span class="proposals-status" id="proposals-status"></span>
  </div>
  <div class="run-log" id="proposals-log"></div>

  <p class="footnote">
    Numbers come from BotProbe <code>/trace</code> events (Elasticsearch) for sessions scoped via
    Mongo <code>AssistantSession</code>. See <code>sample_gothrough.md</code> for the full pipeline.
  </p>
</div>

<script>
function navHref(path, slug){
  return slug ? `${path}?study=${encodeURIComponent(slug)}` : path;
}
function fmtPct(n){ return (n > 0 ? "+" : "") + n + "%"; }
function fmtVal(v){
  if (typeof v !== "number") return v;
  if (Math.abs(v) >= 1000) return Math.round(v).toLocaleString();
  if (Math.abs(v) < 1 && v !== 0) return v.toFixed(3);
  return Number(v.toFixed(2));
}
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

const API = '/api/v1/ypervaino';
let proposalPollTimer = null;

function stopProposalPoll(){
  if (proposalPollTimer) { clearInterval(proposalPollTimer); proposalPollTimer = null; }
}

async function refreshProposalLogs(slug){
  const logEl = document.getElementById('proposals-log');
  if (!logEl) return;
  try {
    const lr = await fetch(`${API}/studies/${encodeURIComponent(slug)}/logs?tail=50`);
    const ld = await lr.json();
    if (ld.lines?.length) {
      logEl.textContent = ld.lines.join('\n');
      logEl.scrollTop = logEl.scrollHeight;
    }
  } catch (_) {}
}

async function fetchProposalStatus(slug){
  const res = await fetch(`${API}/studies/${encodeURIComponent(slug)}/proposals`);
  return res.json();
}

function updateProposalsBar(slug, gen){
  const bar = document.getElementById('proposals-bar');
  const btn = document.getElementById('proposals-btn');
  const status = document.getElementById('proposals-status');
  const logEl = document.getElementById('proposals-log');
  if (!bar || !btn) return;

  bar.classList.remove('hidden');
  const st = gen?.status || 'not_started';

  if (st === 'ready') {
    btn.textContent = 'View proposals';
    btn.disabled = false;
    btn.onclick = () => { window.location.href = navHref('/proposals', slug); };
    status.textContent = 'Proposals ready.';
    logEl.classList.remove('visible');
    stopProposalPoll();
    return;
  }
  if (st === 'generating') {
    btn.textContent = 'Generating proposals…';
    btn.disabled = true;
    status.textContent = 'Phase 4 running — see logs below.';
    logEl.classList.add('visible');
    refreshProposalLogs(slug);
    if (!proposalPollTimer) {
      proposalPollTimer = setInterval(async () => {
        await refreshProposalLogs(slug);
        const data = await fetchProposalStatus(slug);
        const g = data.generation || {};
        if (g.status === 'ready') {
          stopProposalPoll();
          window.location.href = navHref('/proposals', slug);
        } else if (g.status === 'failed') {
          stopProposalPoll();
          updateProposalsBar(slug, g);
        }
      }, 2500);
    }
    return;
  }
  if (st === 'failed') {
    btn.textContent = 'Retry proposal generation';
    btn.disabled = false;
    btn.onclick = () => startProposalGeneration(slug, true);
    status.textContent = 'Generation failed.';
    logEl.classList.add('visible');
    return;
  }
  btn.textContent = 'Generate proposals';
  btn.disabled = false;
  btn.onclick = () => startProposalGeneration(slug, false);
  status.textContent = 'Get VA Blueprint change suggestions from these results.';
  logEl.classList.remove('visible');
}

async function startProposalGeneration(slug, force){
  const btn = document.getElementById('proposals-btn');
  const logEl = document.getElementById('proposals-log');
  if (btn) { btn.disabled = true; btn.textContent = 'Starting…'; }
  if (logEl) logEl.classList.add('visible');
  await fetch(`${API}/studies/${encodeURIComponent(slug)}/proposals/generate${force ? '?force=true' : ''}`, { method: 'POST' });
  updateProposalsBar(slug, { status: 'generating' });
}

async function initProposalsBar(slug){
  try {
    const data = await fetchProposalStatus(slug);
    updateProposalsBar(slug, data.generation || {});
  } catch (_) {
    document.getElementById('proposals-bar')?.classList.remove('hidden');
  }
}

async function load(){
  const slug = new URLSearchParams(window.location.search).get('study');
  document.querySelectorAll('.topnav-link').forEach(a => {
    if (a.getAttribute('href') !== '/') a.href = navHref(a.getAttribute('href'), slug);
  });
  if (!slug) {
    document.getElementById('content').innerHTML = '<div class="error-box">Missing ?study= slug.</div>';
    return;
  }
  document.getElementById('content').innerHTML = '<div class="card"><div class="card-pad">Loading evaluation results…</div></div>';
  let data;
  for (let i = 0; i < 120; i++) {
    const res = await fetch(`/api/v1/ypervaino/studies/${encodeURIComponent(slug)}/results`);
    data = await res.json();
    if (data.status === 'complete' && data.aspects) break;
    if (data.error && data.status !== 'running') break;
    await new Promise(r => setTimeout(r, 2000));
  }

  if (data.error && !data.aspects?.length) {
    document.getElementById('content').innerHTML = `<div class="error-box"><b>Error:</b> ${escapeHtml(String(data.error))}</div>`;
    return;
  }

  const isComparative = data.study_type === 'comparative' || ((data.cohort_sizes?.before || 0) > 0 && (data.cohort_sizes?.after || 0) > 0);

  document.getElementById("desc").textContent = isComparative
    ? `${data.cohort_sizes.total} sessions analyzed — ${data.cohort_sizes.before} before / ${data.cohort_sizes.after} after`
    : `${data.cohort_sizes.total} sessions analyzed (single cohort)`;

  const aspectsHtml = (data.aspects || []).map(a => {
    if (a.no_data) {
      // The plan referenced something the resolver couldn't compute (e.g. an
      // unrecognized component ref/kind) -- say so plainly rather than
      // showing a fabricated 0 that would look like a real measurement.
      return `
      <div class="aspect-card">
        <div class="aspect-card-title">${escapeHtml(a.name)}</div>
        <div class="compare-row"><span class="compare-label">Value</span><span class="compare-val" style="color:var(--ink-3);">No data</span></div>
      </div>`;
    }
    if (!isComparative) {
      const val = a.after ?? a.before ?? a.value ?? 0;
      return `
      <div class="aspect-card">
        <div class="aspect-card-title">${escapeHtml(a.name)}</div>
        <div class="compare-row"><span class="compare-label">Value</span><span class="compare-val">${fmtVal(val)}</span></div>
      </div>`;
    }
    const isGood = a.good_if === "down" ? a.delta_pct <= 0 : a.delta_pct >= 0;
    return `
      <div class="aspect-card">
        <div class="aspect-card-title">${escapeHtml(a.name)}</div>
        <div class="compare-row"><span class="compare-label">Before</span><span class="compare-val">${fmtVal(a.before)}</span></div>
        <div class="compare-row"><span class="compare-label">After</span><span class="compare-val">${fmtVal(a.after)}</span></div>
        <div class="compare-divider"></div>
        <div class="delta-badge ${isGood ? "good" : "bad"}">${fmtPct(a.delta_pct)}</div>
      </div>
    `;
  }).join("");

  const hypHtml = (data.hypotheses || []).map(h => {
    const rates = h.rates || {};
    const isComparativeHyp = !!rates.after;
    const before = rates.before || rates.all || {};
    const after = rates.after || {};
    const sig = (h.proof || {}).significant;
    // Confirmed (enough support, not rejected) reads as positive -> green;
    // rejected (insufficient support) reads as negative -> red.
    const goodBad = h.rejected ? 'bad' : 'good';

    const ratesHtml = isComparativeHyp ? `
      <div class="hyp-rates">
        <div><span class="hyp-rate-label">Before</span><span class="hyp-rate-val">${Math.round((before.rate||0)*100)}% <span class="n">(${before.support||0})</span></span></div>
        <div><span class="hyp-rate-label">After</span><span class="hyp-rate-val">${Math.round((after.rate||0)*100)}% <span class="n">(${after.support||0})</span></span></div>
      </div>` : `
      <div class="hyp-rates">
        <div><span class="hyp-rate-label">Match rate</span><span class="hyp-rate-val">${Math.round((before.rate||0)*100)}% <span class="n">(${before.support||0} sessions)</span></span></div>
      </div>`;

    const pills = [];
    if (sig !== undefined) pills.push(`<span class="status-pill ${sig ? 'good' : 'bad'}">${sig ? 'Significant' : 'Not significant'}</span>`);
    pills.push(`<span class="status-pill ${goodBad}">${h.rejected ? 'Low support' : 'Confirmed'}</span>`);

    const counterIds = (h.counter_examples || []).slice(0,3);
    const countersHtml = counterIds.length ? `
      <div class="hyp-counters">
        <div class="hyp-counters-label">Counter-examples</div>
        ${counterIds.map(id => `<div class="mono">${escapeHtml(id)}</div>`).join('')}
      </div>` : '';

    return `<div class="aspect-card">
      <div class="aspect-card-title">${escapeHtml(h.title||h.id||'')}</div>
      <div class="hyp-desc">${escapeHtml(h.description||'')}</div>
      ${ratesHtml}
      <div>${pills.join('')}</div>
      ${countersHtml}
    </div>`;
  }).join('');

  const narrative = data.narrative ? `<div class="card"><div class="card-head"><h3 class="card-title">Summary</h3></div><div class="card-pad" style="color:var(--ink-2);line-height:1.6;">${escapeHtml(data.narrative)}</div></div>` : '';

  // ArtifactRenderer already writes real matplotlib PNGs to output/plots/ during
  // Phase 3 -- they just weren't ever surfaced in the UI. Serve them via the
  // /plots/{filename} endpoint and show them here now that data actually exists
  // (unlike Explore's chart-type icons, which run before Phase 3 and have no
  // real numbers to draw yet).
  const PLOT_LABELS = {
    aspect_before_after_bar: 'Before vs After',
    aspect_single_cohort_bar: 'Cohort Overview',
    aspect_delta_lollipop: 'Change (Delta)',
    distribution_histogram: 'Distribution',
    hypothesis_rate_comparison: 'Hypothesis Match Rate',
  };
  const plotsDict = (data.evaluation_result && data.evaluation_result.artifacts && data.evaluation_result.artifacts.plots) || {};
  const chartsHtml = Object.entries(plotsDict).map(([key, path]) => {
    const label = PLOT_LABELS[key] || key.replace(/_/g, ' ');
    const filename = String(path).split('/').pop();
    const url = `/api/v1/ypervaino/studies/${encodeURIComponent(slug)}/plots/${encodeURIComponent(filename)}`;
    return `<div class="chart-card"><div class="chart-card-title">${escapeHtml(label)}</div><img src="${url}" alt="${escapeHtml(label)}"></div>`;
  }).join('');
  const chartsSection = chartsHtml
    ? `<div class="card"><div class="card-head"><h3 class="card-title">Charts</h3></div><div class="card-pad"><div class="grid-hyp">${chartsHtml}</div></div></div>`
    : '';

  document.getElementById('content').innerHTML = `
    <div class="grid-kpi">
      <div class="kpi"><div class="kpi-label">Sessions analyzed</div><div class="kpi-value">${data.cohort_sizes.total}</div></div>
      ${isComparative ? `
      <div class="kpi"><div class="kpi-label">Before cohort</div><div class="kpi-value">${data.cohort_sizes.before}</div></div>
      <div class="kpi"><div class="kpi-label">After cohort</div><div class="kpi-value">${data.cohort_sizes.after}</div></div>
      ` : `
      <div class="kpi"><div class="kpi-label">Aspects</div><div class="kpi-value">${(data.aspects||[]).length}</div></div>
      <div class="kpi"><div class="kpi-label">Hypotheses</div><div class="kpi-value">${(data.hypotheses||[]).length}</div></div>
      `}
    </div>
    ${narrative}
    ${chartsSection}
    <div class="card">
      <div class="card-head"><h3 class="card-title">Aspects</h3></div>
      <div class="card-pad"><div class="grid-aspects">${aspectsHtml || '<p>No aspects computed.</p>'}</div></div>
    </div>
    <div class="card">
      <div class="card-head"><h3 class="card-title">Hypotheses</h3></div>
      <div class="card-pad"><div class="grid-hyp">${hypHtml || '<p>No hypotheses evaluated.</p>'}</div></div>
    </div>
  `;
  initProposalsBar(slug);
}

load();
</script>
</body>
</html>
