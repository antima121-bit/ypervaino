<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ypervaíno — Live</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f9f8f8;--surface:#ffffff;--surface-2:#fcfcfb;--surface-3:#f3f2f0;
    --ink:#282624;--ink-2:#7c7972;--ink-3:#b5b1ad;--line:#e1deda;--line-strong:#b5b1ad;
    --signal:#f07400;--signal-strong:#ff7b00;--signal-soft:rgba(240,116,0,.12);
    --success:#027a48;--success-soft:#e7fdf3;
    --critical:#b72d0e;--critical-soft:#fce8e4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--paper);color:var(--ink);font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Roboto","Oxygen","Ubuntu","Cantarell","Fira Sans","Droid Sans","Helvetica Neue",sans-serif;font-size:15px;}
  .mono{font-family:"Roboto Mono",ui-monospace,monospace;}
  .main{max-width:1100px;margin:0 auto;padding:28px 32px 60px;}
  .eyebrow{font-family:"Manrope",-apple-system,BlinkMacSystemFont,sans-serif;font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;background:linear-gradient(90deg, var(--signal-strong), var(--signal));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;margin-bottom:6px;}
  .live-pill{display:flex;width:fit-content;align-items:center;gap:6px;background:var(--signal-soft);color:var(--signal-strong);border-radius:999px;padding:4px 10px 4px 8px;font-size:12.5px;font-weight:600;margin-bottom:14px;}
  .live-dot{width:6px;height:6px;border-radius:50%;background:var(--signal);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .desc{color:var(--ink-2);font-size:14.5px;margin:6px 0 22px;max-width:700px;line-height:1.5;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:18px;}
  .card-head{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line);}
  .card-title{font-size:15px;font-weight:600;margin:0;}
  .card-pad{padding:16px 18px;}
  .grid-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 17px;}
  .kpi-label{font-size:12.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .kpi-value{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;}
  .grid-aspects{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .grid-hyp{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;}
  .aspect-card{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:14px 15px;}
  .aspect-card-title{font-size:14px;font-weight:600;margin-bottom:12px;}
  .compare-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;}
  .compare-label{font-size:11.5px;text-transform:uppercase;color:var(--ink-3);letter-spacing:.03em;}
  .compare-val{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;}
  .compare-divider{height:1px;background:var(--line);margin:8px 0;}
  .delta-badge{font-size:13.5px;font-weight:700;margin-top:6px;}
  .delta-badge.good{color:var(--success);}
  .delta-badge.bad{color:var(--critical);}
  .hyp-desc{font-size:13.5px;color:var(--ink-2);margin:6px 0 12px;line-height:1.5;}
  .hyp-card{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:14px 15px;}
  .hyp-card.hyp-outcome-good{background:#f3fbf6;border-color:#d3f0df;}
  .hyp-card.hyp-outcome-bad{background:#fef5f4;border-color:#f5d6d3;}
  .hyp-card.hyp-outcome-neutral{background:var(--surface-2);}
  .hyp-card-title{font-size:14px;font-weight:600;margin-bottom:8px;}
  .hyp-stat-row{display:flex;gap:18px;flex-wrap:wrap;margin-top:4px;}
  .hyp-stat-label{font-size:10px;text-transform:uppercase;color:var(--ink-3);letter-spacing:.03em;display:block;margin-bottom:2px;}
  .hyp-stat-val{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}
  .hyp-stat-val .n{font-size:11px;font-weight:500;color:var(--ink-3);}
  .chart-card{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:12px;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
  .chart-card:hover{border-color:var(--signal);box-shadow:0 2px 8px rgba(240,116,0,.12);}
  .aspect-card{cursor:pointer;transition:border-color .15s,box-shadow .15s;}
  .aspect-card:hover{border-color:var(--signal);box-shadow:0 2px 8px rgba(240,116,0,.12);}
  .hyp-card{cursor:pointer;transition:box-shadow .15s;}
  .hyp-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .hyp-section-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:700;margin:0 0 10px;grid-column:1 / -1;}
  .hyp-section-label:not(:first-child){margin-top:18px;}
  .comp-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px;}
  .comp-table th,.comp-table td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;}
  .comp-table th{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:700;background:var(--surface-2);}
  .comp-table td.mono{font-family:"Roboto Mono",ui-monospace,monospace;font-size:11.5px;color:var(--ink-2);}
  .modal-backdrop{position:fixed;inset:0;background:rgba(24,22,20,.55);display:flex;align-items:center;justify-content:center;padding:24px;z-index:1000;}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(920px,100%);max-height:min(88vh,900px);overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.18);}
  .modal-close{position:absolute;top:10px;right:12px;border:none;background:var(--surface-3);color:var(--ink-2);width:32px;height:32px;border-radius:8px;font-size:20px;line-height:1;cursor:pointer;z-index:2;}
  .modal-close:hover{background:var(--line);color:var(--ink);}
  .modal-body{padding:22px 22px 18px;overflow-y:auto;}
  .modal-title{font-size:18px;font-weight:700;margin:0 28px 8px 0;}
  .modal-desc{color:var(--ink-2);line-height:1.55;margin-bottom:14px;}
  .modal-stat-row{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0;}
  .modal-predicate{margin:8px 0;padding:10px 12px;background:var(--surface-3);border-radius:8px;font-family:"Roboto Mono",ui-monospace,monospace;font-size:12px;color:var(--ink-2);line-height:1.5;word-break:break-word;}
  .modal-predicate-label{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:700;margin:10px 0 4px;}
  .plot-zoom-viewport{overflow:auto;max-height:70vh;background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;align-items:center;justify-content:center;touch-action:none;}
  .plot-zoom-viewport img{max-width:100%;height:auto;transform-origin:center center;transition:transform .08s ease-out;}
  .session-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px;}
  .session-col{border:1px solid var(--line);border-radius:8px;background:var(--surface-2);min-height:120px;display:flex;flex-direction:column;}
  .session-col-title{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);}
  .session-list{overflow-y:auto;max-height:220px;padding:8px 10px;}
  .session-list a,.session-list span{display:block;font-family:"Roboto Mono",ui-monospace,monospace;font-size:11.5px;padding:5px 6px;border-radius:5px;color:var(--signal-strong);text-decoration:none;word-break:break-all;}
  .session-list a:hover{background:var(--signal-soft);}
  .session-list span{color:var(--ink-3);}
  .chart-card-title{font-size:13px;font-weight:600;margin-bottom:4px;}
  .chart-card-desc{font-size:12px;color:var(--ink-3);margin-bottom:8px;line-height:1.45;}
  .chart-card img{width:100%;height:auto;border-radius:6px;display:block;background:#fff;}
  .charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px;}
  .footnote{font-size:13px;color:var(--ink-3);margin-top:24px;line-height:1.6;}
  .footnote code{color:var(--ink-2);}
  .topnav{display:flex;gap:4px;padding:14px 32px;background:#171717;}
  .topnav-link{color:rgba(255,255,255,.6);text-decoration:none;font-size:14px;padding:6px 12px;border-radius:6px;}
  .topnav-link:hover{background:rgba(255,255,255,.08);color:#ffffff;}
  .topnav-link.active{background:rgba(240,116,0,.16);color:var(--signal-strong);font-weight:600;}
  .error-box{background:var(--critical-soft);color:var(--critical);border-radius:8px;padding:14px 16px;font-size:14.5px;}
  .hidden{display:none!important;}
  .btn{background:var(--signal);color:#ffffff;border:none;border-radius:8px;padding:11px 20px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;}
  .btn:hover{filter:brightness(1.05);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2);}
  .proposals-bar{display:flex;align-items:center;gap:12px;margin-top:24px;flex-wrap:wrap;}
  .proposals-status{font-size:14px;color:var(--ink-2);}
  .run-log{display:none;margin-top:12px;background:#0d1117;color:#c9d1d9;border-radius:8px;padding:10px 12px;font-family:"Roboto Mono",ui-monospace,monospace;font-size:12px;line-height:1.45;max-height:220px;overflow-y:auto;white-space:pre-wrap;}
  .run-log.visible{display:block;}
</style>
</head>
<body>
<div class="topnav">
  <a href="/" class="topnav-link">New Study</a>
  <a href="/explore" class="topnav-link">Explore</a>
  <a href="/results" class="topnav-link active">Results</a>
  <a href="/proposals" class="topnav-link">Proposals</a>
  <a href="/sessions" class="topnav-link">Sessions</a>
</div>
<div class="main">
  <span class="eyebrow">Ypervaíno</span>
  <div class="live-pill"><span class="live-dot"></span>Live — real production data (bot_prod)</div>
  <h1 style="font-size:25px;margin:0 0 4px;">Results</h1>
  <p class="desc" id="desc">Loading…</p>

  <div id="content"></div>

  <div id="proposals-bar" class="proposals-bar hidden">
    <button class="btn" id="proposals-btn">Generate proposals</button>
    <span class="proposals-status" id="proposals-status"></span>
  </div>
  <div class="run-log" id="proposals-log"></div>

  <p class="footnote">
    Numbers come from BotProbe <code>/trace</code> events (Elasticsearch) for sessions scoped via
    Mongo <code>AssistantSession</code>. See <code>sample_gothrough.md</code> for the full pipeline.
  </p>
</div>
<div id="modal-root"></div>

<script>
function navHref(path, slug){
  return slug ? `${path}?study=${encodeURIComponent(slug)}` : path;
}
function fmtPct(n){ return (n > 0 ? "+" : "") + n + "%"; }
function fmtVal(v){
  if (typeof v !== "number") return v;
  if (Math.abs(v) >= 1000) return Math.round(v).toLocaleString();
  if (Math.abs(v) < 1 && v !== 0) return v.toFixed(3);
  return Number(v.toFixed(2));
}
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function escapeAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

const API = '/api/v1/ypervaino';
let proposalPollTimer = null;
let RESULTS = null;
let plotZoom = 1;

function hypPolarity(h){
  const p = (h.polarity || '').toLowerCase();
  if (p === 'negative') return 'negative';
  if ((h.title || '').toLowerCase().includes('(negative)')) return 'negative';
  return 'positive';
}

function componentLabel(comp){
  const ref = comp.ref || {};
  if (ref.kind === 'signal') return ref.name || ref.kind || '—';
  return ref.name || ref.kind || '—';
}

function componentEvent(comp, eventMap, signalMethods){
  const ref = comp.ref || {};
  if (ref.kind === 'signal') {
    const method = signalMethods[ref.name] || 'signal';
    return `semantic signal (${method})`;
  }
  return eventMap[ref.name] || '—';
}

function renderAspectComponents(aspect){
  const eventMap = RESULTS?.primitive_events || {};
  const signalMethods = RESULTS?.signal_methods || {};
  const components = aspect.components || [];
  if (!components.length) {
    return '<div class="modal-desc" style="font-style:italic;margin-top:0;">No components defined.</div>';
  }
  const rows = components.map(c => `
    <tr>
      <td class="mono">${escapeHtml(componentLabel(c))}</td>
      <td>${escapeHtml(c.aggregation || '—')}</td>
      <td class="mono">${escapeHtml(componentEvent(c, eventMap, signalMethods))}</td>
    </tr>`).join('');
  return `<div class="modal-predicate-label" style="margin-top:4px;">Components</div>
  <table class="comp-table">
    <thead><tr><th>Component</th><th>Aggregation</th><th>Related event</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function botprobeUrl(sessionId){
  const base = RESULTS?.botprobe_base_url || '';
  if (!base) return null;
  return `${base}?session_id=${encodeURIComponent(sessionId)}`;
}

function renderSessionList(ids){
  if (!ids.length) return '<span style="color:var(--ink-3);font-size:12px;">None</span>';
  return ids.map(id => {
    const url = botprobeUrl(id);
    return url
      ? `<a href="${url}" target="_blank" rel="noopener noreferrer">${escapeHtml(id)}</a>`
      : `<span>${escapeHtml(id)}</span>`;
  }).join('');
}

function onModalEsc(e){
  if (e.key === 'Escape') closeModal();
}

function closeModal(){
  const root = document.getElementById('modal-root');
  if (root) root.innerHTML = '';
  document.removeEventListener('keydown', onModalEsc);
  plotZoom = 1;
}

function openModal(innerHtml){
  closeModal();
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal" role="dialog" aria-modal="true">
        <button class="modal-close" type="button" aria-label="Close">&times;</button>
        ${innerHtml}
      </div>
    </div>`;
  root.querySelector('.modal-backdrop').addEventListener('click', (e) => {
    if (e.target.id === 'modal-backdrop') closeModal();
  });
  root.querySelector('.modal-close').addEventListener('click', closeModal);
  document.addEventListener('keydown', onModalEsc);
}

function showPlotModal(url, title){
  plotZoom = 1;
  openModal(`
    <div class="modal-body">
      <h2 class="modal-title">${escapeHtml(title)}</h2>
      <div class="plot-zoom-viewport" id="plot-zoom-viewport">
        <img id="plot-zoom-img" src="${url}" alt="${escapeHtml(title)}">
      </div>
    </div>`);
  const viewport = document.getElementById('plot-zoom-viewport');
  const img = document.getElementById('plot-zoom-img');
  if (viewport && img) {
    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      plotZoom = Math.min(5, Math.max(0.25, plotZoom * (e.deltaY < 0 ? 1.1 : 0.9)));
      img.style.transform = `scale(${plotZoom})`;
    }, { passive: false });
  }
}

function aspectValueHtml(a, isComparative){
  if (a.no_data) {
    return '<div class="compare-row"><span class="compare-label">Value</span><span class="compare-val" style="color:var(--ink-3);">No data</span></div>';
  }
  if (!isComparative) {
    const val = a.after ?? a.before ?? a.value ?? 0;
    return `<div class="compare-row"><span class="compare-label">Value</span><span class="compare-val">${fmtVal(val)}</span></div>`;
  }
  const isGood = a.good_if === 'down' ? a.delta_pct <= 0 : a.delta_pct >= 0;
  return `
    <div class="compare-row"><span class="compare-label">Before</span><span class="compare-val">${fmtVal(a.before)}</span></div>
    <div class="compare-row"><span class="compare-label">After</span><span class="compare-val">${fmtVal(a.after)}</span></div>
    <div class="compare-divider"></div>
    <div class="delta-badge ${isGood ? 'good' : 'bad'}">${fmtPct(a.delta_pct)}</div>`;
}

function showAspectModal(idx){
  const a = RESULTS?.aspects?.[idx];
  if (!a) return;
  openModal(`
    <div class="modal-body">
      <h2 class="modal-title">${escapeHtml(a.name)}</h2>
      ${a.description ? `<div class="modal-desc">${escapeHtml(a.description)}</div>` : ''}
      ${aspectValueHtml(a, RESULTS._isComparative)}
      ${renderAspectComponents(a)}
    </div>`);
}

function showHypothesisModal(idx){
  const h = RESULTS?.hypotheses?.[idx];
  if (!h) return;
  const total = h.total_samples ?? RESULTS.cohort_sizes?.total ?? 0;
  const applicable = h.applicable_samples ?? 0;
  const condPct = h.conditional_rate_pct ?? Math.round((h.conditional_rate || 0) * 1000) / 10;
  const lists = h.session_lists || { passed: [], failed: [] };
  openModal(`
    <div class="modal-body">
      <h2 class="modal-title">${escapeHtml(h.title || h.id || '')}</h2>
      ${h.description ? `<div class="modal-desc">${escapeHtml(h.description)}</div>` : ''}
      <div class="modal-stat-row">
        <div><span class="hyp-stat-label">Total samples</span><span class="hyp-stat-val">${total}</span></div>
        <div><span class="hyp-stat-label">Applicable samples</span><span class="hyp-stat-val">${applicable}</span></div>
        <div><span class="hyp-stat-label">Conditional rate</span><span class="hyp-stat-val">${applicable ? condPct + '%' : '—'} <span class="n">${applicable ? `(${h.rates?.all?.matched ?? '—'}/${applicable})` : ''}</span></span></div>
      </div>
      <div class="modal-predicate-label">Scope predicate</div>
      <div class="modal-predicate">${escapeHtml(h.scope_predicate || '—')}</div>
      <div class="modal-predicate-label">Eval predicate</div>
      <div class="modal-predicate">${escapeHtml(h.predicate || '—')}</div>
      <div class="session-columns">
        <div class="session-col">
          <div class="session-col-title">Passed (${lists.passed.length})</div>
          <div class="session-list">${renderSessionList(lists.passed)}</div>
        </div>
        <div class="session-col">
          <div class="session-col-title">Failed (${lists.failed.length})</div>
          <div class="session-list">${renderSessionList(lists.failed)}</div>
        </div>
      </div>
    </div>`);
}

function onResultsClick(e){
  const aspectEl = e.target.closest('[data-aspect-idx]');
  if (aspectEl) { showAspectModal(+aspectEl.dataset.aspectIdx); return; }
  const hypEl = e.target.closest('[data-hyp-idx]');
  if (hypEl) { showHypothesisModal(+hypEl.dataset.hypIdx); return; }
  const chartEl = e.target.closest('[data-plot-url]');
  if (chartEl) { showPlotModal(chartEl.dataset.plotUrl, chartEl.dataset.plotTitle || 'Chart'); }
}

function stopProposalPoll(){
  if (proposalPollTimer) { clearInterval(proposalPollTimer); proposalPollTimer = null; }
}

async function refreshProposalLogs(slug){
  const logEl = document.getElementById('proposals-log');
  if (!logEl) return;
  try {
    const lr = await fetch(`${API}/studies/${encodeURIComponent(slug)}/logs?tail=50`);
    const ld = await lr.json();
    if (ld.lines?.length) {
      logEl.textContent = ld.lines.join('\n');
      logEl.scrollTop = logEl.scrollHeight;
    }
  } catch (_) {}
}

async function fetchProposalStatus(slug){
  const res = await fetch(`${API}/studies/${encodeURIComponent(slug)}/proposals`);
  return res.json();
}

function updateProposalsBar(slug, gen){
  const bar = document.getElementById('proposals-bar');
  const btn = document.getElementById('proposals-btn');
  const status = document.getElementById('proposals-status');
  const logEl = document.getElementById('proposals-log');
  if (!bar || !btn) return;

  bar.classList.remove('hidden');
  const st = gen?.status || 'not_started';

  if (st === 'ready') {
    btn.textContent = 'View proposals';
    btn.disabled = false;
    btn.onclick = () => { window.location.href = navHref('/proposals', slug); };
    status.textContent = 'Proposals ready.';
    logEl.classList.remove('visible');
    stopProposalPoll();
    return;
  }
  if (st === 'generating') {
    btn.textContent = 'Generating proposals…';
    btn.disabled = true;
    status.textContent = 'Phase 4 running — see logs below.';
    logEl.classList.add('visible');
    refreshProposalLogs(slug);
    if (!proposalPollTimer) {
      proposalPollTimer = setInterval(async () => {
        await refreshProposalLogs(slug);
        const data = await fetchProposalStatus(slug);
        const g = data.generation || {};
        if (g.status === 'ready') {
          stopProposalPoll();
          window.location.href = navHref('/proposals', slug);
        } else if (g.status === 'failed') {
          stopProposalPoll();
          updateProposalsBar(slug, g);
        }
      }, 2500);
    }
    return;
  }
  if (st === 'failed') {
    btn.textContent = 'Retry proposal generation';
    btn.disabled = false;
    btn.onclick = () => startProposalGeneration(slug, true);
    status.textContent = 'Generation failed.';
    logEl.classList.add('visible');
    return;
  }
  btn.textContent = 'Generate proposals';
  btn.disabled = false;
  btn.onclick = () => startProposalGeneration(slug, false);
  status.textContent = 'Get VA Blueprint change suggestions from these results.';
  logEl.classList.remove('visible');
}

async function startProposalGeneration(slug, force){
  const btn = document.getElementById('proposals-btn');
  const logEl = document.getElementById('proposals-log');
  if (btn) { btn.disabled = true; btn.textContent = 'Starting…'; }
  if (logEl) logEl.classList.add('visible');
  await fetch(`${API}/studies/${encodeURIComponent(slug)}/proposals/generate${force ? '?force=true' : ''}`, { method: 'POST' });
  updateProposalsBar(slug, { status: 'generating' });
}

async function initProposalsBar(slug){
  try {
    const data = await fetchProposalStatus(slug);
    updateProposalsBar(slug, data.generation || {});
  } catch (_) {
    document.getElementById('proposals-bar')?.classList.remove('hidden');
  }
}

async function load(){
  const slug = new URLSearchParams(window.location.search).get('study');
  document.querySelectorAll('.topnav-link').forEach(a => {
    if (a.getAttribute('href') !== '/') a.href = navHref(a.getAttribute('href'), slug);
  });
  if (!slug) {
    document.getElementById('content').innerHTML = '<div class="error-box">Missing ?study= slug.</div>';
    return;
  }
  document.getElementById('content').innerHTML = '<div class="card"><div class="card-pad">Loading evaluation results…</div></div>';
  let data;
  for (let i = 0; i < 120; i++) {
    const res = await fetch(`/api/v1/ypervaino/studies/${encodeURIComponent(slug)}/results`);
    data = await res.json();
    if (data.status === 'complete' && data.aspects) break;
    if (data.error && data.status !== 'running') break;
    await new Promise(r => setTimeout(r, 2000));
  }

  if (data.error && !data.aspects?.length) {
    document.getElementById('content').innerHTML = `<div class="error-box"><b>Error:</b> ${escapeHtml(String(data.error))}</div>`;
    return;
  }

  const isComparative = data.study_type === 'comparative' || ((data.cohort_sizes?.before || 0) > 0 && (data.cohort_sizes?.after || 0) > 0);
  RESULTS = data;
  RESULTS._isComparative = isComparative;

  const aspectsHtml = (data.aspects || []).map((a, idx) => {
    if (a.no_data) {
      return `
      <div class="aspect-card" data-aspect-idx="${idx}" role="button" tabindex="0">
        <div class="aspect-card-title">${escapeHtml(a.name)}</div>
        <div class="compare-row"><span class="compare-label">Value</span><span class="compare-val" style="color:var(--ink-3);">No data</span></div>
      </div>`;
    }
    if (!isComparative) {
      const val = a.after ?? a.before ?? a.value ?? 0;
      return `
      <div class="aspect-card" data-aspect-idx="${idx}" role="button" tabindex="0">
        <div class="aspect-card-title">${escapeHtml(a.name)}</div>
        <div class="compare-row"><span class="compare-label">Value</span><span class="compare-val">${fmtVal(val)}</span></div>
      </div>`;
    }
    const isGood = a.good_if === "down" ? a.delta_pct <= 0 : a.delta_pct >= 0;
    return `
      <div class="aspect-card" data-aspect-idx="${idx}" role="button" tabindex="0">
        <div class="aspect-card-title">${escapeHtml(a.name)}</div>
        <div class="compare-row"><span class="compare-label">Before</span><span class="compare-val">${fmtVal(a.before)}</span></div>
        <div class="compare-row"><span class="compare-label">After</span><span class="compare-val">${fmtVal(a.after)}</span></div>
        <div class="compare-divider"></div>
        <div class="delta-badge ${isGood ? "good" : "bad"}">${fmtPct(a.delta_pct)}</div>
      </div>
    `;
  }).join("");

  function renderHypCard(h, idx){
    const total = h.total_samples ?? data.cohort_sizes?.total ?? 0;
    const applicable = h.applicable_samples ?? 0;
    const condPct = h.conditional_rate_pct ?? Math.round((h.conditional_rate || 0) * 1000) / 10;
    const outcome = h.outcome || 'neutral';
    const outcomeClass = outcome === 'good' ? 'hyp-outcome-good' : outcome === 'bad' ? 'hyp-outcome-bad' : 'hyp-outcome-neutral';
    return `<div class="hyp-card ${outcomeClass}" data-hyp-idx="${idx}" role="button" tabindex="0">
      <div class="hyp-card-title">${escapeHtml(h.title||h.id||'')}</div>
      <div class="hyp-desc">${escapeHtml(h.description||'')}</div>
      <div class="hyp-stat-row">
        <div><span class="hyp-stat-label">Total samples</span><span class="hyp-stat-val">${total}</span></div>
        <div><span class="hyp-stat-label">Applicable samples</span><span class="hyp-stat-val">${applicable}</span></div>
        <div><span class="hyp-stat-label">Conditional rate</span><span class="hyp-stat-val">${applicable ? condPct + '%' : '—'} <span class="n">${applicable ? `(${h.rates?.all?.matched ?? '—'}/${applicable})` : ''}</span></span></div>
      </div>
    </div>`;
  }

  const hypEntries = (data.hypotheses || []).map((h, idx) => ({ h, idx }));
  const posHyps = hypEntries.filter(({ h }) => hypPolarity(h) !== 'negative');
  const negHyps = hypEntries.filter(({ h }) => hypPolarity(h) === 'negative');
  const hypHtmlPos = posHyps.map(({ h, idx }) => renderHypCard(h, idx)).join('');
  const hypHtmlNeg = negHyps.map(({ h, idx }) => renderHypCard(h, idx)).join('');
  const hypHtml = [
    posHyps.length ? `<div class="hyp-section-label">Positive</div>${hypHtmlPos}` : '',
    negHyps.length ? `<div class="hyp-section-label">Negative</div>${hypHtmlNeg}` : '',
  ].join('') || '<p>No hypotheses evaluated.</p>';

  const narrative = data.narrative ? `<div class="card"><div class="card-head"><h3 class="card-title">Summary</h3></div><div class="card-pad" style="color:var(--ink-2);line-height:1.6;">${escapeHtml(data.narrative)}</div></div>` : '';

  document.getElementById("desc").textContent = isComparative
    ? `${data.cohort_sizes.total} sessions analyzed — ${data.cohort_sizes.before} before / ${data.cohort_sizes.after} after`
    : `${data.cohort_sizes.total} sessions analyzed (single cohort)`;

  const plotMeta = data.plot_meta || {};
  const plotsDict = data.plots || (data.evaluation_result && data.evaluation_result.artifacts && data.evaluation_result.artifacts.plots) || {};
  const chartsHtml = Object.entries(plotsDict).map(([plotId, path]) => {
    const meta = plotMeta[plotId] || {};
    const label = meta.title || plotId.replace(/_/g, ' ');
    const desc = meta.description || '';
    const filename = String(path).split('/').pop();
    const url = `/api/v1/ypervaino/studies/${encodeURIComponent(slug)}/plots/${encodeURIComponent(filename)}`;
    return `<div class="chart-card" data-plot-url="${escapeAttr(url)}" data-plot-title="${escapeAttr(label)}" role="button" tabindex="0"><div class="chart-card-title">${escapeHtml(label)}</div>${desc ? `<div class="chart-card-desc">${escapeHtml(desc)}</div>` : ''}<img src="${url}" alt="${escapeHtml(label)}" loading="lazy"></div>`;
  }).join('');
  const chartsSection = chartsHtml
    ? `<div class="card"><div class="card-head"><h3 class="card-title">Charts</h3></div><div class="card-pad"><div class="charts-grid">${chartsHtml}</div></div></div>`
    : '';

  document.getElementById('content').innerHTML = `
    <div class="grid-kpi">
      <div class="kpi"><div class="kpi-label">Sessions analyzed</div><div class="kpi-value">${data.cohort_sizes.total}</div></div>
      ${isComparative ? `
      <div class="kpi"><div class="kpi-label">Before cohort</div><div class="kpi-value">${data.cohort_sizes.before}</div></div>
      <div class="kpi"><div class="kpi-label">After cohort</div><div class="kpi-value">${data.cohort_sizes.after}</div></div>
      ` : `
      <div class="kpi"><div class="kpi-label">Aspects</div><div class="kpi-value">${(data.aspects||[]).length}</div></div>
      <div class="kpi"><div class="kpi-label">Hypotheses</div><div class="kpi-value">${(data.hypotheses||[]).length}</div></div>
      `}
    </div>
    ${narrative}
    ${chartsSection}
    <div class="card">
      <div class="card-head"><h3 class="card-title">Aspects</h3></div>
      <div class="card-pad"><div class="grid-aspects">${aspectsHtml || '<p>No aspects computed.</p>'}</div></div>
    </div>
    <div class="card">
      <div class="card-head"><h3 class="card-title">Hypotheses</h3></div>
      <div class="card-pad"><div class="grid-hyp">${hypHtml}</div></div>
    </div>
  `;
  const content = document.getElementById('content');
  content.removeEventListener('click', onResultsClick);
  content.addEventListener('click', onResultsClick);
  initProposalsBar(slug);
}

load();
</script>
</body>
</html>
