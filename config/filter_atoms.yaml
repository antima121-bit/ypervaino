# Maps New Study UI cohort_filters[].atom_id → conversation_predicate operands.
# Compiler: filter_atom_compiler.py reads this registry.
# See input_schema.md §2.3 and problem_statement_modelling.md §6.

schema_version: "1.0"
updated_at: "2026-09-06"

atoms:
  - id: main_stream_model_is
    label: "Main stream model is"
    description: "Include session if any main_stream LLM invocation used this model_id"
    primitive: main_stream_models_invoked
    op: "contains"
    value_type: string
    ui_control: text

  - id: turn_count_at_least
    label: "Turn count at least"
    primitive: turn_count
    op: ">="
    value_type: integer
    ui_control: number

  - id: turn_count_at_most
    label: "Turn count at most"
    primitive: turn_count
    op: "<="
    value_type: integer
    ui_control: number

  - id: session_duration_at_least_minutes
    label: "Session duration at least (minutes)"
    primitive: session_duration_ms
    op: ">="
    value_type: float
    value_transform: "minutes_to_ms"
    ui_control: number

  - id: transfer_completed
    label: "Call transfer completed"
    primitive: transfer_completed
    op: "=="
    value: true
    value_type: boolean
    ui_control: toggle

  - id: tool_error_occurred
    label: "Tool error occurred"
    primitive: tool_error_count
    op: ">"
    value: 0
    value_type: integer
    ui_control: toggle

  - id: tool_invoked_at_least
    label: "Tool invocations at least"
    primitive: tool_invocation_count
    op: ">="
    value_type: integer
    ui_control: number

  - id: interruption_at_least
    label: "Interruptions at least"
    primitive: interruption_count
    op: ">="
    value_type: integer
    ui_control: number
